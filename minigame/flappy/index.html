<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>try{if(window.self!==window.top)document.documentElement.classList.add("framed");}catch(e){document.documentElement.classList.add("framed");}</script>
<title>Flappy Bee · Cyrro Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<script>
  try {
    var t = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  } catch (e) {}

</script>
<style>
  :root{
    --bg:#FCFBF7; --ink:#0A0A0A; --ink-dim:#4B5240; --card:#FFFFFF;
    --line:#0A0A0A; --shadow:#0A0A0A; --grid:rgba(10,10,10,.12);
    --lime:#CCFF00; --pink:#FF0055;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  :root[data-theme="dark"]{
    --bg:#0A0A0A; --ink:#F4F4F0; --ink-dim:#B9C0A8; --card:#141414;
    --line:#F4F4F0; --shadow:#CCFF00; --grid:rgba(244,244,240,.12);
  }
  *{box-sizing:border-box;margin:0}
  [hidden]{display:none!important}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  body{
    font-family:Outfit,system-ui,sans-serif;color:var(--ink);background-color:var(--bg);
    background-image:
      linear-gradient(var(--grid) 1.5px,transparent 1.5px),
      linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
    background-size:40px 40px;
    position:fixed;inset:0;width:100%;
    padding:12px 12px 16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    animation:drift 24s linear infinite;
  }
  html.embed body{padding-bottom:120px} /* ruang buat player bar di Library */
  @keyframes drift{from{background-position:0 0}to{background-position:40px 40px}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .wrap{width:min(100%,440px);display:flex;flex-direction:column;align-items:center;gap:12px}

  /* ---------- header ---------- */
  .top{width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;animation:rise .6s var(--ease) both}
  .title{
    font-family:Anton,Impact,sans-serif;font-weight:400;font-size:42px;line-height:1;text-transform:uppercase;
    background:var(--lime);color:#0A0A0A;border:3px solid #0A0A0A;padding:4px 12px 0;
    box-shadow:4px 4px 0 var(--shadow);
  }
  .cap{font:700 10px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;color:var(--ink-dim)}
  .scores{display:flex;gap:10px}
  .box{
    background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);
    padding:4px 12px;min-width:84px;text-align:center;animation:rise .6s var(--ease) .1s both;
  }
  .box + .box{animation-delay:.18s}
  .lbl{display:block;font:700 10px/1.3 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.12em;color:var(--ink-dim)}
  .val{display:block;font-family:Anton,Impact,sans-serif;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
  .val.bump{animation:bump .35s var(--ease)}
  @keyframes bump{40%{transform:scale(1.25)}}

  /* ---------- arena (canvas, rasio 2:3) ---------- */
  .arena{
    position:relative;width:min(100%,340px,calc((100dvh - 230px) * 2 / 3));aspect-ratio:2/3;
    border:3px solid var(--line);box-shadow:8px 8px 0 var(--shadow);
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
    animation:rise .7s var(--ease) .15s both;
  }
  .arena canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* pill petunjuk: di bawah lebah, nggak nutupin */
  .pill{
    position:absolute;left:50%;bottom:72px;z-index:3;transform:translateX(-50%);
    font-family:Anton,Impact,sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
    background:var(--lime);color:#0A0A0A;border:3px solid #0A0A0A;box-shadow:3px 3px 0 #0A0A0A;padding:6px 12px 4px;
    animation:bob 1.4s ease-in-out infinite;
  }
  @keyframes bob{50%{transform:translate(-50%,-4px)}}

  .ov{
    position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:14px;
    background:rgba(10,10,10,.4);opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .ov.show{opacity:1;pointer-events:auto}
  .ovcard{
    width:100%;max-width:270px;background:var(--card);color:var(--ink);border:3px solid var(--line);
    box-shadow:5px 5px 0 var(--shadow);padding:14px 12px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;
    transform:translateY(12px) scale(.96);transition:transform .35s var(--ease);
  }
  .ov.show .ovcard{transform:none}
  .ovcard h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;line-height:1;text-transform:uppercase}
  .statline{font:700 12px/1.4 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase}
  .statline b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:18px;letter-spacing:0}
  .sub{font:400 11px/1.4 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim)}
  .tag{
    font-family:Anton,Impact,sans-serif;font-size:17px;text-transform:uppercase;letter-spacing:.03em;
    background:var(--pink);color:#FFFFFF;border:3px solid #0A0A0A;padding:3px 10px 1px;box-shadow:3px 3px 0 #0A0A0A;
    animation:bob 1.4s ease-in-out infinite;
  }
  .rank{
    font-family:Anton,Impact,sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.04em;
    background:var(--lime);color:#0A0A0A;border:3px solid #0A0A0A;padding:4px 14px 2px;box-shadow:3px 3px 0 #0A0A0A;
  }
  .ov-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  /* ---------- tombol ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font:700 13px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;
    color:#0A0A0A;background:#FFFFFF;border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);
    padding:12px 12px;cursor:pointer;white-space:nowrap;
    transition:transform .08s ease,box-shadow .08s ease,background-color .2s ease;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
  .btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
  .btn.lime{background:var(--lime)}
  .btn.white{background:#FFFFFF}
  .btn.pink{background:var(--pink);color:#FFFFFF}
  .btn.big{font-size:15px;padding:14px 18px;width:100%}
  .btn[aria-pressed="false"]{background:var(--card);color:var(--ink)}
  .btn:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

  .controls{width:100%;display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:stretch}
  .status{
    font:700 11px/1.3 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-dim);min-height:14px;text-align:center;width:100%;
  }
  .status.err{color:var(--pink)}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }

  /* ===== intro (sama seperti Library) ===== */
  .intro{position:fixed;inset:0;z-index:200;background:#0a0a0a;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:20px;transition:opacity .45s ease,visibility .45s;overflow:hidden}
  .intro.out{opacity:0;visibility:hidden}
  .intro::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(204,255,0,.12) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(204,255,0,.12) 1.5px,transparent 1.5px);background-size:40px 40px;animation:intro-grid 1.6s linear infinite;pointer-events:none}
  .intro-t{position:relative;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:clamp(52px,18vw,96px);line-height:1;color:#fff;animation:intro-pop .6s cubic-bezier(.2,.9,.3,1.2) both,intro-glitch 2.4s steps(1) .8s infinite}
  .intro-t .hl{color:var(--lime,#ccff00)}
  .intro-s{position:relative;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--pink,#ff0055);animation:intro-rise .5s .35s both}
  .intro-bar{position:relative;width:min(60vw,240px);height:14px;border:3px solid #fff;box-shadow:3px 3px 0 #ccff00;margin-top:12px;overflow:hidden}
  .intro-bar i{display:block;height:100%;background:#ccff00;transform-origin:left;animation:intro-grow 1.1s .2s cubic-bezier(.6,0,.2,1) both}
  @keyframes intro-pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
  @keyframes intro-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes intro-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes intro-grid{to{background-position:40px 40px}}
  @keyframes intro-glitch{0%,90%,100%{transform:none;text-shadow:none}91%{transform:translate(-3px,1px);text-shadow:3px 0 #ff0055,-3px 0 #ccff00}93%{transform:translate(3px,-1px);text-shadow:-3px 0 #ff0055,3px 0 #ccff00}95%{transform:none;text-shadow:none}}
  @media (prefers-reduced-motion: reduce){.intro{display:none}}
</style>
</head>
<body>
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-t">FLAPPY<span class="hl">-</span>BEE</div>
  <div class="intro-s">BERSIAP…</div>
  <div class="intro-bar"><i></i></div>
</div>
<main class="wrap">
  <header class="top">
    <div class="brand">
      <h1 class="title">Flappy Bee</h1>
      <span class="cap">MINI GAME · CYRRO</span>
    </div>
    <div class="scores">
      <div class="box"><span class="lbl">SKOR</span><span class="val" id="score" aria-live="off">0</span></div>
      <div class="box"><span class="lbl">TERBAIK</span><span class="val" id="best">0</span></div>
    </div>
  </header>

  <div class="arena" id="arena">
    <canvas id="cv" role="img" aria-label="Permainan Flappy Bee"></canvas>

    <div class="pill" id="startHint">Tap buat terbang</div>

    <div class="ov" id="pauseOv">
      <div class="ovcard">
        <h2>JEDA</h2>
        <div class="ov-btns">
          <button class="btn lime" id="btnResume" type="button">LANJUT</button>
          <button class="btn white" id="btnRestartP" type="button">ULANG</button>
        </div>
        <p class="sub">P atau ESC buat lanjut</p>
      </div>
    </div>

    <div class="ov" id="overOv">
      <div class="ovcard">
        <span class="tag" id="ovNew" hidden>REKOR BARU!</span>
        <h2>GAME OVER</h2>
        <span class="rank" id="ovRank">LARVA</span>
        <p class="statline">skor <b id="ovScore">0</b> · terbaik <b id="ovBest">0</b></p>
        <div class="ov-btns">
          <button class="btn white" id="btnRetry" type="button">MAIN LAGI</button>
          <button class="btn pink" id="btnResend" type="button" hidden>KIRIM SKOR</button>
        </div>
        <p class="sub">tap atau spasi buat main lagi</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnPause" type="button">JEDA</button>
    <button class="btn" id="btnSfx" type="button" aria-pressed="true">SUARA ON</button>
    <button class="btn big pink" id="btnFlap" type="button">KEPAK ▲</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
</main>

<script>
(() => {
  const SB_URL = 'https://nmfoshrrflgnuubsxuhk.supabase.co';
  const SB_KEY = 'sb_publishable_E9ynSVNfTGCzBqFhlg2Huw_UFNxq72l';
  const BEST_KEY = 'flappy_best';
  const SFX_KEY = 'flappy_sfx';

  // ==== CORE (murni, tanpa DOM) ====
  const W = 320, H = 480, GROUND = 440, BEE_X = 84, BEE_R = 13;
  const GRAV = 0.42, FLAP_V = -7.4, GAP = 136, PW = 52, SPACING = 180;
  const READY_Y = 220;

  function newWorld(mode){
    return { mode, y: READY_Y, vy: 0, pipes: [], score: 0, speed: 2.4, gx: 0, flapT: 0, events: [] };
  }

  function spawnPipe(st){
    const gapY = 110 + Math.random() * (GROUND - 220);
    st.pipes.push({ x: W + 10, gapY, passed: false });
  }

  function flap(st){
    st.vy = FLAP_V;
    st.events.push({ t: 'flap' });
  }

  function circleHitsRect(cx, cy, r, x, y, w, h){
    const nx = Math.max(x, Math.min(cx, x + w));
    const ny = Math.max(y, Math.min(cy, y + h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  // satu langkah simulasi. Return true kalau tabrakan.
  function update(st, dt){
    st.speed = Math.min(4.4, 2.4 + st.score * 0.05);
    st.flapT += dt * 0.35;
    st.gx = (st.gx + st.speed * dt) % 24;

    st.vy += GRAV * dt;
    st.y += st.vy * dt;
    if (st.y - BEE_R < 0){ st.y = BEE_R; st.vy = 0; }
    if (st.y + BEE_R >= GROUND) return true;

    if (st.pipes.length === 0 || st.pipes[st.pipes.length - 1].x < W - SPACING) spawnPipe(st);
    for (const p of st.pipes) p.x -= st.speed * dt;
    st.pipes = st.pipes.filter(p => p.x + PW > -10);

    const r = BEE_R - 2;
    for (const p of st.pipes){
      if (!p.passed && p.x + PW < BEE_X - BEE_R){
        p.passed = true;
        st.score++;
        st.events.push({ t: 'pass' });
      }
      const top = p.gapY - GAP / 2, bot = p.gapY + GAP / 2;
      if (circleHitsRect(BEE_X, st.y, r, p.x, 0, PW, top)) return true;
      if (circleHitsRect(BEE_X, st.y, r, p.x, bot, PW, GROUND - bot)) return true;
    }
    return false;
  }
  // ==== END CORE ====

  // ==== DOM ====
  const $ = id => document.getElementById(id);
  const arena = $('arena');
  const cv = $('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = $('score');
  const bestEl = $('best');
  const startHint = $('startHint');
  const pauseOv = $('pauseOv');
  const overOv = $('overOv');
  const ovScoreEl = $('ovScore');
  const ovBestEl = $('ovBest');
  const ovRankEl = $('ovRank');
  const ovNewEl = $('ovNew');
  const btnRetry = $('btnRetry');
  const btnResend = $('btnResend');
  const btnResume = $('btnResume');
  const btnRestartP = $('btnRestartP');
  const btnPause = $('btnPause');
  const btnSfx = $('btnSfx');
  const btnFlap = $('btnFlap');
  const statusEl = $('status');

  const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
  function setStatus(msg, err){
    statusEl.textContent = msg;
    statusEl.classList.toggle('err', !!err);
  }
  function isDark(){ return document.documentElement.dataset.theme === 'dark'; }

  let best = parseInt(lsGet(BEST_KEY), 10) || 0;
  let st = newWorld('ready');
  let readyT = 0;
  let gameNo = 0, pendingScore = 0, sending = false, saved = false;
  let scale = 1, dpr = 1;
  let last = 0, overAt = 0, shownScore = -1;
  let sfxOn = lsGet(SFX_KEY) !== 'off';
  let actx = null;

  const fx = { shake: 0, flash: 0, parts: [], pops: [] };

  function fit(){
    const r = arena.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    scale = r.width / W;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  }

  // ---------- suara (WebAudio, tanpa file) ----------
  function beep(f1, f2, dur, type, vol){
    if (!sfxOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  // ---------- efek ----------
  function puff(){
    for (let i = 0; i < 2; i++){
      fx.parts.push({
        x: BEE_X - 14, y: st.y + (Math.random() - .5) * 6,
        vx: -1.1 - Math.random() * .8, vy: (Math.random() - .5) * 1.2,
        life: 1, s: 3 + Math.random() * 2, c: '#FFFFFF'
      });
    }
  }
  function burst(){
    const cols = ['#FFD600', '#CCFF00', '#FF0055', isDark() ? '#F4F4F0' : '#0A0A0A'];
    for (let i = 0; i < 18; i++){
      const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3.5;
      fx.parts.push({
        x: BEE_X, y: st.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        life: 1, s: 4 + Math.random() * 4, c: cols[i % cols.length]
      });
    }
  }
  function handleEvents(s){
    for (const ev of s.events){
      if (ev.t === 'flap'){
        beep(520, 760, .08, 'triangle', .035);
        puff();
      } else if (ev.t === 'pass'){
        beep(880, 1320, .12, 'square', .03);
        fx.pops.push({ x: BEE_X + 20, y: s.y - 26, life: 1 });
      }
    }
    s.events.length = 0;
  }
  function stepFx(dt){
    fx.shake *= Math.pow(.85, dt); if (fx.shake < .2) fx.shake = 0;
    fx.flash *= Math.pow(.9, dt); if (fx.flash < .01) fx.flash = 0;
    for (const p of fx.parts){ p.vy += .25 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= .025 * dt; }
    fx.parts = fx.parts.filter(p => p.life > 0);
    for (const q of fx.pops){ q.y -= .7 * dt; q.life -= .022 * dt; }
    fx.pops = fx.pops.filter(q => q.life > 0);
  }

  // ---------- gambar ----------
  function block(x, y, w, h, fill, ink, shadow){
    ctx.fillStyle = shadow; ctx.fillRect(x + 4, y + 4, w, h);
    ctx.fillStyle = fill;   ctx.fillRect(x, y, w, h);
    ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.strokeRect(x, y, w, h);
  }

  function drawBee(y, vy, flapT, ink, forceAngle){
    const angle = forceAngle != null ? forceAngle : Math.max(-0.45, Math.min(0.9, vy * 0.06));
    const wy = Math.sin(flapT) * 4;
    ctx.save();
    ctx.translate(BEE_X, y);
    ctx.rotate(angle);

    // sengat
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.moveTo(-13, -3); ctx.lineTo(-22, 0); ctx.lineTo(-13, 3); ctx.closePath();
    ctx.fill();

    // sayap
    ctx.beginPath();
    ctx.ellipse(-2, -11 + wy, 9, 6, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = ink; ctx.stroke();

    // badan
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 11, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFD600'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.stroke();

    // belang
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 11, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#0A0A0A';
    ctx.fillRect(-6, -14, 4, 28);
    ctx.fillRect(2, -14, 4, 28);
    ctx.restore();

    // mata
    ctx.beginPath(); ctx.arc(8, -3, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#0A0A0A'; ctx.stroke();
    ctx.beginPath(); ctx.arc(9, -3, 1.4, 0, Math.PI * 2);
    ctx.fillStyle = '#0A0A0A'; ctx.fill();

    ctx.restore();
  }

  function drawScore(n){
    ctx.save();
    ctx.font = "400 56px Anton, Impact, 'Arial Narrow', sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#0A0A0A';
    ctx.strokeText(String(n), W / 2, 20);
    ctx.fillStyle = '#CCFF00';
    ctx.fillText(String(n), W / 2, 20);
    ctx.restore();
  }

  function draw(s){
    const dark = isDark();
    const ink = dark ? '#F4F4F0' : '#0A0A0A';
    const shadow = dark ? '#CCFF00' : '#0A0A0A';
    const bg = dark ? '#0A0A0A' : '#FCFBF7';
    const grid = dark ? 'rgba(244,244,240,.12)' : 'rgba(10,10,10,.12)';
    const lime = '#CCFF00', pink = '#FF0055';

    ctx.save();
    if (fx.shake > 0){
      ctx.translate((Math.random() - .5) * fx.shake, (Math.random() - .5) * fx.shake);
    }

    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // grid bergerak
    ctx.strokeStyle = grid; ctx.lineWidth = 1.5;
    for (let x = -s.gx; x < W; x += 24){
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GROUND); ctx.stroke();
    }
    for (let y = 24; y < GROUND; y += 24){
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // pilar
    for (const p of s.pipes){
      const top = p.gapY - GAP / 2, bot = p.gapY + GAP / 2;
      block(p.x, 0, PW, top - 18, lime, ink, shadow);
      block(p.x - 6, top - 18, PW + 12, 18, pink, ink, shadow);
      block(p.x - 6, bot, PW + 12, 18, pink, ink, shadow);
      block(p.x, bot + 18, PW, GROUND - bot - 18, lime, ink, shadow);
    }

    // tanah hazard
    ctx.fillStyle = lime;
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = ink;
    ctx.fillRect(0, GROUND, W, 4);
    for (let x = -24 - s.gx; x < W + 24; x += 24){
      ctx.beginPath();
      ctx.moveTo(x, GROUND + 4);
      ctx.lineTo(x + 10, GROUND + 4);
      ctx.lineTo(x + 2, H);
      ctx.lineTo(x - 8, H);
      ctx.closePath();
      ctx.fill();
    }

    // partikel
    for (const p of fx.parts){
      ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    // lebah (miring jatuh kalau game over)
    drawBee(s.y, s.vy, s.flapT, ink, s.mode === 'over' ? 1.2 : null);

    // +1 yang melayang
    ctx.save();
    ctx.font = "400 24px Anton, Impact, sans-serif";
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#0A0A0A';
    ctx.fillStyle = lime;
    for (const q of fx.pops){
      ctx.globalAlpha = Math.max(0, q.life);
      ctx.strokeText('+1', q.x, q.y);
      ctx.fillText('+1', q.x, q.y);
    }
    ctx.restore();

    ctx.restore();

    // kilatan merah saat nabrak
    if (fx.flash > 0){
      ctx.fillStyle = 'rgba(255,0,85,' + (fx.flash * .3).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (s.mode === 'running' || s.mode === 'paused' || s.mode === 'over'){
      drawScore(s.score);
    }
  }

  function showScore(){
    const s = st.score;
    if (s !== shownScore){
      shownScore = s;
      scoreEl.textContent = s;
      scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
      const b = Math.max(best, s);
      if (bestEl.textContent !== String(b)) bestEl.textContent = b;
    }
  }

  function rankOf(n){
    if (n >= 20) return 'RATU LEBAH';
    if (n >= 10) return 'PENJAGA';
    if (n >= 5) return 'PEKERJA';
    return 'LARVA';
  }

  // ---------- alur game ----------
  function setPauseBtn(){
    const paused = st.mode === 'paused';
    btnPause.textContent = paused ? 'LANJUT' : 'JEDA';
    btnPause.setAttribute('aria-pressed', String(paused));
  }

  function startGame(){
    gameNo++;
    saved = false; sending = false; pendingScore = 0;
    st = newWorld('running');
    st.y = READY_Y;
    fx.parts = []; fx.pops = []; fx.flash = 0; fx.shake = 0;
    shownScore = -1;
    startHint.hidden = true;
    overOv.classList.remove('show');
    pauseOv.classList.remove('show');
    btnResend.hidden = true;
    setStatus('');
    setPauseBtn();
    flap(st); // tap pertama langsung kepak
  }

  function gameOver(){
    st.mode = 'over';
    st.y = Math.min(st.y, GROUND - BEE_R);
    overAt = performance.now();
    const s = st.score;
    const isNew = s > 0 && s > best;
    if (s > best){ best = s; lsSet(BEST_KEY, String(best)); }
    pendingScore = s;

    ovScoreEl.textContent = s;
    ovBestEl.textContent = best;
    ovRankEl.textContent = rankOf(s);
    ovNewEl.hidden = !isNew;

    fx.flash = 1;
    fx.shake = REDUCED ? 0 : 12;
    burst();
    beep(320, 50, .4, 'sawtooth', .06);
    if (navigator.vibrate) navigator.vibrate([40, 30, 60]);
    setPauseBtn();

    const g = gameNo;
    setTimeout(() => {
      if (gameNo === g && st.mode === 'over') overOv.classList.add('show');
    }, 550);

    submitScore(s);
  }

  function togglePause(){
    if (st.mode === 'running'){
      st.mode = 'paused';
      pauseOv.classList.add('show');
    } else if (st.mode === 'paused'){
      st.mode = 'running';
      pauseOv.classList.remove('show');
    } else {
      return;
    }
    setPauseBtn();
  }

  function act(){
    if (st.mode === 'ready'){ startGame(); return; }
    if (st.mode === 'running'){ flap(st); return; }
    if (st.mode === 'over'){
      if (overOv.classList.contains('show') && performance.now() - overAt > 1000) startGame();
    }
    // paused: diam, pilih LANJUT atau ULANG di overlay
  }

  function renderSfx(){
    btnSfx.textContent = sfxOn ? 'SUARA ON' : 'SUARA OFF';
    btnSfx.setAttribute('aria-pressed', String(sfxOn));
  }
  function sfxToggle(){
    sfxOn = !sfxOn;
    lsSet(SFX_KEY, sfxOn ? 'on' : 'off');
    renderSfx();
  }

  // ---------- sesi Supabase (token dari localStorage, tanpa library) ----------
  function readSession(){
    try {
      for (let i = 0; i < localStorage.length; i++){
        const key = localStorage.key(i);
        if (key && key.startsWith('sb-') && key.endsWith('-auth-token')){
          const s = JSON.parse(localStorage.getItem(key));
          if (s && s.access_token && s.user) return { key, s };
        }
      }
    } catch (e) {}
    return null;
  }

  async function freshSession(){
    const found = readSession();
    if (!found) return null;
    const { key, s } = found;
    const expiring = s.expires_at && s.expires_at * 1000 < Date.now() + 30000;
    if (!expiring) return s;
    if (!s.refresh_token) return null;
    try {
      const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token })
      });
      if (!res.ok) return null;
      const n = await res.json();
      const updated = { ...s, ...n, expires_at: n.expires_at || Math.floor(Date.now() / 1000) + (n.expires_in || 3600) };
      lsSet(key, JSON.stringify(updated));
      return updated;
    } catch (e) {
      return null;
    }
  }

  function displayName(s){
    const m = s.user.user_metadata || {};
    return String((m.display_name || '').trim() || 'PEMAIN').slice(0, 30);
  }

  async function submitScore(score){
    if (sending || saved) return;
    const id = gameNo;
    if (score <= 0){ setStatus('SKOR 0 TIDAK DIKIRIM'); return; }

    sending = true;
    btnResend.hidden = true;
    setStatus('MENYIMPAN...');

    const s = await freshSession();
    if (!s){
      sending = false;
      setStatus('LOGIN DULU', true);
      if (id === gameNo) btnResend.hidden = false;
      return;
    }
    try {
      const res = await fetch(`${SB_URL}/rest/v1/flappy_scores`, {
        method: 'POST',
        headers: {
          apikey: SB_KEY,
          Authorization: `Bearer ${s.access_token}`,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal'
        },
        body: JSON.stringify({ user_id: s.user.id, name: displayName(s), score })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (id === gameNo){ saved = true; setStatus('TERSIMPAN'); }
    } catch (e) {
      if (id === gameNo){ setStatus('GAGAL KIRIM', true); btnResend.hidden = false; }
    } finally {
      sending = false;
    }
  }

  // ---------- input ----------
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W'){
      e.preventDefault();
      if (!e.repeat) act();
    } else if (k === 'p' || k === 'P' || k === 'Escape'){
      if (st.mode === 'running' || st.mode === 'paused') togglePause();
    } else if ((k === 'r' || k === 'R') && st.mode === 'over' && overOv.classList.contains('show')){
      startGame();
    }
  });

  arena.addEventListener('pointerdown', e => {
    if (e.target.closest('.ov')) return;
    e.preventDefault();
    act();
  });

  btnFlap.addEventListener('pointerdown', e => {
    e.preventDefault();
    act();
  });

  btnPause.addEventListener('click', togglePause);
  btnSfx.addEventListener('click', sfxToggle);
  btnResume.addEventListener('click', togglePause);
  btnRestartP.addEventListener('click', startGame);
  btnRetry.addEventListener('click', startGame);
  btnResend.addEventListener('click', () => submitScore(pendingScore));

  // jeda otomatis saat tab disembunyikan
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && st.mode === 'running') togglePause();
  });

  // ---------- loop ----------
  function loop(now){
    const dt = last ? Math.min(2, (now - last) / 16.67) : 1;
    last = now;

    if (st.mode === 'running'){
      const crashed = update(st, dt);
      handleEvents(st);
      if (crashed) gameOver();
    } else if (st.mode === 'ready'){
      readyT += dt;
      st.y = READY_Y + Math.sin(readyT * 0.08) * 8;
      st.flapT += dt * 0.35;
      st.gx = (st.gx + 1.2 * dt) % 24;
    }

    stepFx(dt);
    draw(st);
    if (st.mode !== 'ready') showScore();
    requestAnimationFrame(loop);
  }

  // ---------- mulai ----------
  renderSfx(); // sinkronkan label tombol suara dengan preferensi tersimpan
  fit();
  window.addEventListener('resize', fit);
  bestEl.textContent = best;
  scoreEl.textContent = 0;
  requestAnimationFrame(loop);
})();
</script>
<script>
(function(){
  var el = document.getElementById('intro');
  if (!el) return;
  function done(){ el.classList.add('out'); setTimeout(function(){ el.remove(); }, 500); }
  el.addEventListener('click', done);
  setTimeout(done, 1600);
})();
</script>
