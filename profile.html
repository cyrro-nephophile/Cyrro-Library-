<head>

<title>Profil — C-Library</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--bg:#fcfbf7;--fg:#0a0a0a;--mut:#4b5240;--line:#0a0a0a;--card:#fff;--lime:#ccff00;--pink:#ff0055;--sh:#0a0a0a}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f4f4f0;--mut:#b9c0a8;--line:#f4f4f0;--card:#141414;--sh:#ccff00}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:'Outfit',system-ui,sans-serif;font-size:17px;line-height:1.5;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:-160px;z-index:-1;pointer-events:none;will-change:transform;
  background-image:linear-gradient(rgba(10,10,10,.16) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(10,10,10,.16) 1.5px,transparent 1.5px),linear-gradient(rgba(10,10,10,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(10,10,10,.06) 1px,transparent 1px);
  background-size:160px 160px,160px 160px,32px 32px,32px 32px;
  animation:gridMove 24s linear infinite}
:root[data-theme="dark"] body::before{background-image:linear-gradient(rgba(244,244,240,.12) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(244,244,240,.12) 1.5px,transparent 1.5px),linear-gradient(rgba(244,244,240,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(244,244,240,.05) 1px,transparent 1px)}
@keyframes gridMove{to{transform:translate(160px,160px)}}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.disp{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-weight:400;line-height:.95;letter-spacing:.01em}

.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;height:calc(env(safe-area-inset-top,0px) + 64px);padding:env(safe-area-inset-top,0px) 16px 0;background:#101510;border-bottom:4px solid #0a0a0a}
.top .wm{flex:1;color:#fff;font-size:30px;text-decoration:none}
.top .wm i{font-style:normal;color:var(--lime)}
.back{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;text-decoration:none;color:#0a0a0a;background:var(--lime);border:3px solid #0a0a0a;padding:8px 12px;box-shadow:3px 3px 0 #0a0a0a;white-space:nowrap}
.mode{width:44px;height:44px;flex:none;cursor:pointer;background:#fff;border:3px solid #0a0a0a;display:grid;place-items:center;box-shadow:3px 3px 0 #0a0a0a}

main{max-width:1080px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top,0px) + 28px) 18px 72px}
.state{display:grid;justify-items:start;gap:14px;padding:20px;background:var(--card);border:3px dashed var(--line);font-family:'JetBrains Mono',monospace;font-size:13px}
.btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;text-decoration:none;color:#0a0a0a;background:var(--lime);border:3px solid #0a0a0a;padding:8px 14px;box-shadow:3px 3px 0 #0a0a0a}

.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:24px;background:var(--card);border:3px solid var(--line);box-shadow:8px 8px 0 var(--sh)}
.av{width:150px;height:150px;display:grid;place-items:center;overflow:hidden;background:var(--lime);color:#0a0a0a;border:3px solid #0a0a0a;box-shadow:6px 6px 0 #0a0a0a;font-family:'Anton',Impact,sans-serif;font-size:72px;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who{font-size:clamp(44px,9vw,92px);word-break:break-word}
.meta{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut)}
.bio{margin-top:12px;max-width:52ch;white-space:pre-line;word-break:break-word}
.stats{display:flex;flex-wrap:wrap;gap:10px 12px;margin-top:16px}
.stat{padding:3px 10px;background:var(--bg);border:3px solid var(--line);box-shadow:3px 3px 0 var(--sh);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.stat strong{margin-left:6px;padding:0 5px;background:var(--lime);color:#0a0a0a}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.stats{justify-content:center}}

.sh{display:flex;align-items:center;gap:14px;margin:48px 0 20px}
.sh h2{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1;background:var(--lime);color:#0a0a0a;border:3px solid #0a0a0a;padding:4px 14px 2px;transform:rotate(-1.5deg);box-shadow:5px 5px 0 #0a0a0a}
.sh i{flex:1;height:3px;background:var(--line)}
.sh span{padding:2px 8px;background:var(--card);border:3px solid var(--line);box-shadow:3px 3px 0 var(--sh);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;white-space:nowrap}

.gg{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px}
@media (min-width:760px){.gg{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gc{display:grid;align-content:start;gap:4px;min-width:0;padding:16px 14px;background:var(--card);border:3px solid var(--line);box-shadow:6px 6px 0 var(--sh);transition:transform .15s ease,box-shadow .15s ease}
.gc:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--sh)}
.gc.empty{border-style:dashed;box-shadow:none}
.gc h3{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-weight:400;font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .big{margin-top:10px;font-family:'Anton',Impact,sans-serif;font-size:42px;line-height:1;word-break:break-all}
.gc.empty .big{color:var(--mut)}
.gc .rank{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;line-height:1.5}
.gc .rank.gold{background:var(--lime);color:#0a0a0a;padding:0 4px;justify-self:start}
.gc .sub,.gc .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hist{list-style:none;display:grid;gap:12px}
.hi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 var(--sh)}
.tag{padding:2px 6px;background:var(--lime);color:#0a0a0a;border:2px solid #0a0a0a;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;white-space:nowrap}
.mt{min-width:0}
.sc{display:block;font-family:'Anton',Impact,sans-serif;font-size:24px;line-height:1.1}
.mt small{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut)}
.dt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut);text-align:right;white-space:nowrap}
.none{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--mut)}
.more{display:block;margin:20px auto 0;padding:10px 18px;background:#fff;color:#0a0a0a;border:3px solid #0a0a0a;box-shadow:4px 4px 0 #0a0a0a;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;cursor:pointer}
.more:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #0a0a0a}
.more:active{transform:translate(2px,2px);box-shadow:none}
.fbox{display:grid;gap:12px;padding:16px;background:var(--card);border:3px solid var(--line);box-shadow:6px 6px 0 var(--sh)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.fkey{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--mut)}
.fcode{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:28px;letter-spacing:.12em;background:var(--lime);color:#0a0a0a;padding:0 8px;border:3px solid #0a0a0a}
.fin{flex:1;min-width:160px;padding:8px;border:3px solid var(--line);background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.pb{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;padding:8px 12px;background:#fff;color:#0a0a0a;border:3px solid #0a0a0a;box-shadow:3px 3px 0 #0a0a0a;cursor:pointer}
.pb.pri{background:var(--lime)}
.fmsg{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut);min-height:1em}
.flist{list-style:none;display:grid;gap:10px;margin-top:16px}
.fi{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 var(--sh)}
.fav{width:38px;height:38px;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--lime);color:#0a0a0a;border:2px solid #0a0a0a;font-family:'Anton',Impact,sans-serif;font-size:18px}
.fav img{width:100%;height:100%;object-fit:cover;display:block}
.fname{flex:1;min-width:0;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:18px;text-decoration:none;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.fwait,.fnone{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut)}
#pubWrap{margin-top:14px}
.pb:disabled{opacity:.55;cursor:default}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
#view .hero,#view .sh,#view .gc,#view .hi{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
#view .av{animation:pop .6s cubic-bezier(.3,1.4,.5,1) .1s backwards}
@media (prefers-reduced-motion:reduce){#view *,body::before{animation:none!important}.gc,.more{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="index.html">← BALIK</a>
  <a class="wm disp" href="index.html">C-<i>LIBRARY</i></a>
  <button class="mode" id="modeBtn" type="button" aria-label="Ganti tema"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="#0a0a0a"/></svg></button>
</header>

<main>
  <p class="state" id="state">Memuat profil...</p>

  <div class="state" id="guest" hidden>
    <p>Kamu belum login.</p>
    <a class="btn" href="login.html">LOGIN</a>
  </div>

  <div id="view" hidden>
    <section class="hero" aria-labelledby="who">
      <div class="av" id="av"></div>
      <div>
        <h1 class="disp who" id="who">PEMAIN</h1>
        <p class="meta" id="meta"></p>
        <p class="bio" id="bio"></p>
        <div id="pubWrap" hidden><button class="pb pri" id="pubFriend" type="button">TAMBAH TEMAN</button></div>
        <div class="stats">
          <span class="stat">TOTAL SKOR<strong id="stTotal">0</strong></span>
          <span class="stat">GAME DIMAINKAN<strong id="stGames">0/7</strong></span>
          <span class="stat">TERAKHIR MAIN<strong id="stLast">—</strong></span>
        </div>
      </div>
    </section>

    <div class="sh"><h2>Skor tertinggi</h2><i></i><span>7 GAME</span></div>
    <ol class="gg" id="best"></ol>

    <section id="friends" hidden>
      <div class="sh"><h2>Teman</h2><i></i><span id="frCount">0 TEMAN</span></div>
      <div class="fbox">
        <div class="frow">
          <span class="fkey">KODE KAMU</span>
          <strong class="fcode" id="myCode">------</strong>
          <button type="button" class="pb" id="copyCode">SALIN</button>
        </div>
        <div class="frow">
          <input id="codeIn" class="fin" maxlength="6" placeholder="Kode teman" autocomplete="off" autocapitalize="characters">
          <button type="button" class="pb pri" id="addBtn">TAMBAH</button>
        </div>
        <p class="fmsg" id="fmsg" aria-live="polite"></p>
      </div>
      <ol class="flist" id="flist"></ol>
    </section>

    <div class="sh"><h2>Riwayat</h2><i></i><span id="histCount">0 SKOR</span></div>
    <ol class="hist" id="hist"></ol>
    <button class="more" id="more" type="button" hidden>MUAT LAGI</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SB_URL='https://nmfoshrrflgnuubsxuhk.supabase.co';
  var SB_KEY='sb_publishable_E9ynSVNfTGCzBqFhlg2Huw_UFNxq72l';
  var PAGE=20, RANK={sulit:3,sedang:2};

  var $=function(id){return document.getElementById(id);};
  var fmt=function(n){return Number(n).toLocaleString('id-ID');};
  var when=function(s){return new Date(s).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});};
  var el=function(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
  function show(id){['state','guest','view'].forEach(function(k){$(k).hidden=(k!==id);});}

  // teks dan aturan skor sama dengan leaderboard di index.html
  var GAMES=[
    {id:'catur',name:'CATUR',table:'chess_scores',lb:'chess_leaderboard',wk:'chess_weekly',cols:'level,moves,created_at',
     main:function(r){return 'LVL '+r.level;},
     sub:function(r){return r.moves+' LANGKAH';},
     cmp:function(a,b){return (b.level-a.level)||(a.moves-b.moves);}},
    {id:'pacman',name:'PAC-MAN',table:'pacman_scores',lb:'pacman_leaderboard',wk:'pacman_weekly',cols:'score,created_at',
     main:function(r){return fmt(r.score);},
     sub:function(){return 'POIN';},
     cmp:function(a,b){return b.score-a.score;}},
    {id:'tetris',name:'TETRIS',table:'tetris_scores',lb:'tetris_leaderboard',wk:'tetris_weekly',cols:'score,level,created_at',
     main:function(r){return fmt(r.score);},
     sub:function(r){return 'POIN · LVL '+r.level;},
     cmp:function(a,b){return b.score-a.score;}},
    {id:'blockblast',name:'BLOCK BLAST',table:'blockblast_scores',lb:'blockblast_leaderboard',wk:'blockblast_weekly',cols:'score,created_at',
     main:function(r){return fmt(r.score);},
     sub:function(){return 'POIN';},
     cmp:function(a,b){return b.score-a.score;}},
    {id:'minesweeper',name:'MINESWEEPER',table:'minesweeper_scores',lb:'minesweeper_leaderboard',wk:'minesweeper_weekly',cols:'level,secs,created_at',
     main:function(r){return String(r.secs);},
     sub:function(r){return 'DETIK · '+String(r.level).toUpperCase();},
     cmp:function(a,b){return ((RANK[b.level]||1)-(RANK[a.level]||1))||(a.secs-b.secs);}},
    {id:'2048',name:'2048',table:'game2048_scores',lb:'game2048_leaderboard',wk:'game2048_weekly',cols:'score,max_tile,created_at',
     main:function(r){return fmt(r.score);},
     sub:function(r){return 'POIN · UBIN '+r.max_tile;},
     cmp:function(a,b){return b.score-a.score;}},
    {id:'dino',name:'DINO',table:'dino_scores',lb:'dino_leaderboard',wk:'dino_weekly',cols:'score,created_at',
     main:function(r){return fmt(r.score);},
     sub:function(){return 'POIN';},
     cmp:function(a,b){return b.score-a.score;}}
  ];

  // angka naik pelan dari 0 (dilewati kalau user minta gerak dikurangi)
  function count(elm,to){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ elm.textContent=fmt(to); return; }
    var t0=null;
    function step(ts){
      if(t0===null) t0=ts;
      var p=Math.min(1,(ts-t0)/900);
      elm.textContent=fmt(Math.round(to*(1-Math.pow(1-p,3))));
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function histItem(x){
    var li=el('li','hi'), mt=el('div','mt');
    mt.appendChild(el('span','sc',x.g.main(x.r)));
    mt.appendChild(el('small',null,x.g.sub(x.r)));
    li.appendChild(el('span','tag',x.g.name));
    li.appendChild(mt);
    li.appendChild(el('span','dt',when(x.r.created_at)));
    return li;
  }

  function render(p,rows,all,ranks){
    var name=p.name||'PEMAIN', ini=name.charAt(0).toUpperCase(), avatar=p.avatar_url;

    var av=$('av');
    av.replaceChildren(el('span',null,ini));
    if(avatar){
      var img=el('img');
      img.alt='';
      img.onerror=function(){av.replaceChildren(el('span',null,ini));};
      img.src=avatar;
      av.replaceChildren(img);
    }

    $('who').textContent=name;
    $('meta').textContent=(p.pub?'Profil publik · ':'')+'Member sejak '+when(p.created_at);
    $('bio').textContent=p.bio||'';
    var played=GAMES.filter(function(g){return rows[g.id].length;}).length;
    count($('stTotal'),all.length);
    $('stGames').textContent=played+'/'+GAMES.length;
    $('stLast').textContent=all.length?when(all[0].r.created_at):'—';
    $('histCount').textContent=fmt(all.length)+' SKOR';

    var best=$('best');
    best.replaceChildren();
    GAMES.forEach(function(g){
      var list=rows[g.id], li=el('li','gc'+(list.length?'':' empty'));
      li.appendChild(el('h3',null,g.name));
      if(list.length){
        var top=list.slice().sort(g.cmp)[0];
        li.appendChild(el('div','big',g.main(top)));
        li.appendChild(el('div','sub',g.sub(top)));
        li.appendChild(el('div','cnt',fmt(list.length)+' SKOR'));
        var rk=ranks[g.id], rkEl=el('div','rank',(rk.all?'#'+rk.all:'–')+' SEPANJANG MASA · '+(rk.week?'#'+rk.week:'–')+' MINGGU INI');
        if(rk.all===1||rk.week===1) rkEl.classList.add('gold');
        li.appendChild(rkEl);
      }else{
        li.appendChild(el('div','big','—'));
        li.appendChild(el('div','cnt','BELUM MAIN'));
      }
      li.style.setProperty('--d',(200+best.children.length*70)+'ms');
      best.appendChild(li);
    });

    var hist=$('hist'), more=$('more'), shown=0;
    hist.replaceChildren();
    if(!all.length) hist.appendChild(el('li','none','Belum ada skor. Yuk main dulu di Library!'));
    function draw(){
      var frag=document.createDocumentFragment();
      all.slice(shown,shown+PAGE).forEach(function(x,j){var li=histItem(x);li.style.setProperty('--d',(j*45)+'ms');frag.appendChild(li);});
      hist.appendChild(frag);
      shown=Math.min(all.length,shown+PAGE);
      more.hidden=shown>=all.length;
    }
    more.onclick=draw;
    draw();
    show('view');
  }

  // Supabase membatasi 1000 baris per request, jadi ambil per halaman sampai habis
  function fetchAll(g,uid){
    var out=[], from=0, step=1000;
    function next(){
      return window.sbClient.from(g.table).select(g.cols).eq('user_id',uid).order('created_at',{ascending:false}).range(from,from+step-1)
        .then(function(res){
          if(res.error) throw res.error;
          var d=res.data||[];
          out=out.concat(d);
          if(d.length<step) return out;
          from+=step;
          return next();
        });
    }
    return next();
  }

  // ambil semua baris view leaderboard per halaman
  function pageAll(table,cols){
    var out=[], from=0, step=1000;
    function next(){
      return window.sbClient.from(table).select(cols).order('user_id',{ascending:true}).range(from,from+step-1)
        .then(function(res){
          if(res.error) throw res.error;
          var d=res.data||[];
          out=out.concat(d);
          if(d.length<step) return out;
          from+=step;
          return next();
        });
    }
    return next();
  }

  // posisi uid: 1 + jumlah pemain yang skornya lebih baik (null kalau belum masuk daftar)
  function rankOf(rows,g,uid){
    var me=rows.find(function(r){return r.user_id===uid;});
    if(!me) return null;
    var pos=1;
    rows.forEach(function(r){ if(g.cmp(r,me)<0) pos++; });
    return pos;
  }

  function load(p,uid){
    show('state');
    $('state').textContent='Memuat profil...';
    var ranksP=Promise.all(GAMES.map(function(g){
      return Promise.all([pageAll(g.lb,g.cols+',user_id'),pageAll(g.wk,g.cols+',user_id')]);
    }));
    return Promise.all([Promise.all(GAMES.map(function(g){return fetchAll(g,uid);})),ranksP]).then(function(out){
      var res=out[0], rk=out[1], ranks={}, rows={}, all=[];
      GAMES.forEach(function(g,i){
        rows[g.id]=res[i];
        ranks[g.id]={all:rankOf(rk[i][0],g,uid), week:rankOf(rk[i][1],g,uid)};
        rows[g.id].forEach(function(r){all.push({g:g,r:r});});
      });
      all.sort(function(a,b){return new Date(b.r.created_at)-new Date(a.r.created_at);});
      render(p,rows,all,ranks);
    });
  }

  $('modeBtn').addEventListener('click',function(){
    var h=document.documentElement, nx=h.getAttribute('data-theme')==='dark'?'light':'dark';
    h.setAttribute('data-theme',nx);
    try{localStorage.setItem('theme',nx);}catch(e){}
  });

  if(!window.supabase){
    $('state').textContent='Gagal memuat Supabase. Coba refresh ya.';
    return;
  }
  window.sbClient=window.supabase.createClient(SB_URL,SB_KEY);

  // ===== tambah teman dari profil publik =====
  var PUB_LABEL={accepted:'SUDAH TEMAN',outgoing:'MENUNGGU',incoming:'TERIMA',none:'TAMBAH TEMAN',guest:'LOGIN DULU'};
  var PUB_SENT={sent:'MENUNGGU',already:'SUDAH TEMAN',pending:'MENUNGGU',login:'LOGIN DULU'};
  async function initAddFriend(uid){
    var st=await window.sbClient.rpc('friend_state',{p_user:uid});
    var state=st.data||'guest';
    if(state==='self') return;
    var b=$('pubFriend');
    $('pubWrap').hidden=false;
    b.textContent=PUB_LABEL[state]||'TAMBAH TEMAN';
    b.disabled=(state==='accepted'||state==='outgoing');
    if(state==='guest'){ b.onclick=function(){ location.href='login.html'; }; }
    else if(state==='none'){
      b.onclick=async function(){
        b.disabled=true; b.textContent='MENGIRIM...';
        var r=await window.sbClient.rpc('send_friend_request_to',{p_user:uid});
        b.textContent=r.error?'GAGAL':(PUB_SENT[r.data]||'TAMBAH TEMAN');
        b.disabled=!r.error;
      };
    }
    else if(state==='incoming'){
      b.onclick=async function(){
        b.disabled=true;
        await window.sbClient.rpc('respond_friend_request',{p_from:uid,p_accept:true});
        b.textContent='SUDAH TEMAN';
      };
    }
  }

  // ===== teman =====
  var FM={sent:'Permintaan terkirim. Tunggu dia menerima ya.',not_found:'Kode itu nggak ketemu.',self:'Itu kode kamu sendiri.',already:'Kalian udah berteman.',pending:'Permintaan udah ada, cek daftar di bawah.',login:'Login dulu ya.'};
  function fmsg(t){ $('fmsg').textContent=t||''; }

  function frow(f){
    var li=el('li','fi'), av=el('span','fav'), ini=(f.name||'?').charAt(0).toUpperCase();
    if(f.avatar_url){
      var im=el('img'); im.alt='';
      im.onerror=function(){ av.replaceChildren(el('span',null,ini)); };
      im.src=f.avatar_url; av.replaceChildren(im);
    }else av.textContent=ini;
    var nm=el('a','fname',f.name); nm.href='profile.html?u='+encodeURIComponent(f.friend_id);
    var acts=el('span','facts');
    function btn(label,cls,fn){ var b=el('button',cls,label); b.type='button'; b.onclick=fn; acts.appendChild(b); }
    if(f.status==='accepted'){
      btn('HAPUS','pb',function(){ if(confirm('Hapus '+f.name+' dari daftar teman?')) act('remove_friend',{p_other:f.friend_id}); });
    }else if(f.incoming){
      btn('TERIMA','pb pri',function(){ act('respond_friend_request',{p_from:f.friend_id,p_accept:true}); });
      btn('TOLAK','pb',function(){ act('respond_friend_request',{p_from:f.friend_id,p_accept:false}); });
    }else{
      acts.appendChild(el('span','fwait','MENUNGGU'));
      btn('BATAL','pb',function(){ act('remove_friend',{p_other:f.friend_id}); });
    }
    li.append(av,nm,acts);
    return li;
  }

  async function loadList(){
    var r=await window.sbClient.rpc('my_friends');
    var list=r.data||[], ol=$('flist');
    ol.replaceChildren();
    list.forEach(function(f){ ol.appendChild(frow(f)); });
    $('frCount').textContent=list.filter(function(f){return f.status==='accepted';}).length+' TEMAN';
    if(!list.length) ol.appendChild(el('li','fnone','Belum ada teman. Bagiin kode kamu ya.'));
  }

  async function act(fn,args){
    var r=await window.sbClient.rpc(fn,args);
    if(r.error) fmsg('Gagal: '+r.error.message);
    loadList();
  }

  async function initFriends(){
    $('friends').hidden=false;
    var c=await window.sbClient.rpc('my_friend_code');
    $('myCode').textContent=c.data||'------';
    $('copyCode').onclick=function(){
      if(!c.data) return;
      navigator.clipboard.writeText(c.data)
        .then(function(){ fmsg('Kode udah disalin.'); })
        .catch(function(){ fmsg('Gagal menyalin.'); });
    };
    $('addBtn').onclick=async function(){
      var code=$('codeIn').value.trim();
      if(code.length!==6){ fmsg('Kodenya 6 karakter.'); return; }
      var r=await window.sbClient.rpc('send_friend_request',{p_code:code});
      if(r.error){ fmsg('Gagal: '+r.error.message); return; }
      fmsg(FM[r.data]||'Gagal menambah teman.');
      $('codeIn').value='';
      loadList();
    };
    loadList();
  }

  // profil publik: profile.html?u=<id>, tidak perlu login
  var uidParam=new URLSearchParams(location.search).get('u');
  if(uidParam){
    if(!/^[0-9a-f-]{36}$/i.test(uidParam)){ $('state').textContent='Profil tidak ditemukan.'; return; }
    window.sbClient.rpc('get_public_profile',{uid:uidParam}).then(function(res){
      if(res.error) throw res.error;
      var row=(res.data||[])[0];
      if(!row){ $('state').textContent='Profil tidak ditemukan.'; return; }
      initAddFriend(uidParam.toLowerCase());
      return load({name:row.display_name,avatar_url:row.avatar_url,bio:row.bio,created_at:row.created_at,pub:true},uidParam.toLowerCase());
    }).catch(function(){
      $('state').textContent='Gagal memuat profil. Coba refresh ya.';
    });
    return;
  }

  // profil sendiri: wajib login
  window.sbClient.auth.getSession().then(function(res){
    var s=res.data&&res.data.session;
    if(!s){ show('guest'); return; }
    var m=s.user.user_metadata||{};
    initFriends();
    return load({name:m.display_name,avatar_url:m.avatar_url,bio:m.bio,created_at:s.user.created_at},s.user.id);
  }).catch(function(){
    $('state').textContent='Gagal memuat profil. Coba refresh ya.';
    show('state');
  });
})();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
