<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Cyrro Library</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <h1>Login</h1>

  <input id="email" type="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button id="signup">Daftar</button>
  <button id="login">Login</button>
  <button id="logout">Logout</button>

  <p id="status"></p>

  <script>
    const SUPABASE_URL = 'https://nmfoshrrflgnuubsxuhk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_E9ynSVNfTGCzBqFhlg2Huw_UFNxq72l';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const msg = document.getElementById('status');

    document.getElementById('signup').onclick = async () => {
      const { error } = await sb.auth.signUp({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });
      msg.textContent = error ? 'Gagal: ' + error.message : 'Daftar berhasil, cek email buat konfirmasi.';
    };

    document.getElementById('login').onclick = async () => {
      const { data, error } = await sb.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });
      msg.textContent = error ? 'Gagal: ' + error.message : 'Login berhasil, halo ' + data.user.email;
    };

    document.getElementById('logout').onclick = async () => {
      await sb.auth.signOut();
      msg.textContent = 'Sudah logout.';
    };
  </script>
</body>
</html>
