name: Android APK

on:
  push:
    branches:
      - main
      - "setup/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug and Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            for candidate in /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found. Checked SDK root: $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare local web assets
        shell: bash
        run: |
          mkdir -p www
          rsync -a --delete \
            --exclude='/www/' \
            --exclude='/android/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/package*.json' \
            --exclude='/capacitor.config.json' \
            ./ www/
          test -f www/index.html
          test -f www/manifest.json
          test -f www/sw.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets with Android
        run: npx cap sync android

      - name: Configure Maven Central fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ("build.gradle", "settings.gradle"):
              path = Path("android") / name
              if path.exists():
                  source = path.read_text()
                  mirror = "maven { url 'https://repo1.maven.org/maven2' }; mavenCentral()"
                  source = source.replace("mavenCentral()", mirror)
                  path.write_text(source)
          PY
          echo "Checking Maven Central mirrors..."
          curl -fsSI --retry 2 https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.2.0/kotlin-stdlib-2.2.0.pom
          curl -fsSI --retry 2 https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.2.0/kotlin-stdlib-2.2.0.pom

      - name: Build Debug and Release APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: c-library-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: c-library-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
