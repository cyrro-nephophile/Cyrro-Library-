<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shooter · Cyrro Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FCFBF7;
    --fg: #0A0A0A;
    --muted: #4B5240;
    --card: #FFFFFF;
    --lime: #CCFF00;
    --pink: #FF0055;
    --shadow: #0A0A0A;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0A0A; --fg: #F4F4F0; --muted: #B9C0A8;
      --card: #141414; --shadow: #CCFF00;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0A0A; --fg: #F4F4F0; --muted: #B9C0A8;
    --card: #141414; --shadow: #CCFF00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Outfit, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .wrap {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .title {
    font-family: Anton, Impact, sans-serif;
    font-size: 40px;
    text-transform: uppercase;
    line-height: 1;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat {
    background: var(--card);
    border: 3px solid var(--fg);
    box-shadow: 4px 4px 0 var(--shadow);
    padding: 8px 10px;
  }
  .stat b {
    display: block;
    font-family: Anton, Impact, sans-serif;
    font-size: 26px;
    font-weight: 400;
    margin-top: 2px;
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 360 / 560;
    border: 3px solid var(--fg);
    box-shadow: 6px 6px 0 var(--shadow);
    background: var(--card);
    cursor: crosshair;
    touch-action: none;
    overflow: hidden;
  }
  .board canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    pointer-events: none;
    background: color-mix(in srgb, var(--card) 80%, transparent);
  }
  .overlay[hidden] { display: none; }
  .ov-main {
    font-family: Anton, Impact, sans-serif;
    font-size: 44px;
    text-transform: uppercase;
    line-height: 1;
    padding: 0 12px;
  }
  .ov-sub {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 0 12px;
    color: var(--muted);
  }

  .btn {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .06em;
    text-transform: uppercase;
    background: var(--lime);
    color: #0A0A0A;
    border: 3px solid var(--fg);
    box-shadow: 3px 3px 0 var(--shadow);
    padding: 10px 14px;
    cursor: pointer;
  }
  .btn:hover  { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow); }
  .btn:active { transform: translate(2px, 2px); box-shadow: none; }
  .btn.sec    { background: var(--card); color: var(--fg); }

  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .status {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    min-height: 16px;
  }

  .hist {
    background: var(--card);
    border: 3px solid var(--fg);
    box-shadow: 4px 4px 0 var(--shadow);
    padding: 10px;
  }
  .hist ol {
    list-style: none;
    display: grid;
    gap: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
  }
  .hist li { display: flex; justify-content: space-between; }

  .help {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="label">11 GAME · Shooter</div>
    <div class="title">Shooter</div>
  </div>

  <div class="stats">
    <div class="stat"><span class="label">Terbaik</span><b id="best">—</b></div>
    <div class="stat"><span class="label">Level Tertinggi</span><b id="maxLv">—</b></div>
  </div>

  <div class="board" id="board" role="button" tabindex="0" aria-label="Area permainan Shooter">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov">
      <div class="ov-main" id="ovMain">TAP UNTUK MULAI</div>
      <div class="ov-sub" id="ovSub">Geser untuk gerak · tembak otomatis</div>
    </div>
  </div>

  <div class="help">Geser jari / mouse untuk gerak · Panah atau A/D di keyboard · Tembak otomatis · 3 nyawa</div>

  <div class="row">
    <div id="status" class="status"></div>
    <button id="resetBtn" class="btn sec" type="button">RESET</button>
  </div>

  <div class="hist">
    <div class="label" style="margin-bottom:6px">Riwayat</div>
    <ol id="histList"><li><span>Belum ada percobaan</span></li></ol>
  </div>
</div>

<script>
(() => {
  // ==== Konfigurasi Supabase ====
  const SB_URL = "https://nmfoshrrflgnuubsxuhk.supabase.co";
  const SB_KEY = "sb_publishable_E9ynSVNfTGCzBqFhlg2Huw_UFNxq72l";
  const TABLE = "shooter_scores";

  // ==== Konstanta ====
  const W = 360, H = 560;
  const PLAYER_Y = H - 56;
  const PH = 12;                 // setengah ukuran kotak tabrakan pemain
  const MAX_LIVES = 5;
  const START_LIVES = 3;
  const COLORS = { lime: "#CCFF00", pink: "#FF0055", cyan: "#00E5FF", white: "#FFFFFF", yellow: "#FFE866", gray: "#8A949C" };
  const ACCENTS = [COLORS.lime, COLORS.cyan, COLORS.pink, COLORS.yellow];

  // Stat dasar musuh
  const ETYPES = {
    grunt:   { w: 30, h: 26, hp: 1, speed: 90, pts: 10 },
    zig:     { w: 30, h: 26, hp: 2, speed: 80, pts: 20 },
    shooter: { w: 34, h: 30, hp: 3, speed: 46, pts: 35 },
    tank:    { w: 46, h: 36, hp: 6, speed: 36, pts: 60 }
  };

  // 10 level bertema. Setelah itu level terus berlanjut (GELOMBANG n) dengan tingkat kesulitan naik.
  const LEVELS = [
    { name: "PEMANASAN",     count: 12, interval: 1.1,  types: { grunt: 1 },                          boss: null },
    { name: "SERBUAN",       count: 16, interval: 1.0,  types: { grunt: 3, zig: 1 },                  boss: null },
    { name: "SIRENE",        count: 18, interval: 0.9,  types: { grunt: 3, zig: 2, shooter: 1 },      boss: null },
    { name: "BADAI",         count: 22, interval: 0.8,  types: { grunt: 3, zig: 2, shooter: 2, tank: 1 }, boss: null },
    { name: "PENJAGA",       count: 12, interval: 1.2,  types: { grunt: 2, zig: 1 },                  boss: { hp: 30 } },
    { name: "KABUT",         count: 26, interval: 0.75, types: { grunt: 2, zig: 2, shooter: 2, tank: 1 }, boss: null },
    { name: "ZIGZAG",        count: 28, interval: 0.65, types: { zig: 3, shooter: 2 },                boss: null },
    { name: "HUJAN PELURU",  count: 30, interval: 0.6,  types: { shooter: 3, zig: 2, tank: 1 },       boss: null },
    { name: "BARISAN TANK",  count: 30, interval: 0.6,  types: { tank: 3, shooter: 2, zig: 2 },       boss: null },
    { name: "RAJA",          count: 16, interval: 0.9,  types: { grunt: 2, zig: 2, shooter: 1 },      boss: { hp: 60 } }
  ];

  function levelCfg(n) {
    if (n <= LEVELS.length) return LEVELS[n - 1];
    const k = n - LEVELS.length;
    return {
      name: "GELOMBANG " + n,
      count: 30 + k * 4,
      interval: Math.max(0.28, 0.6 - k * 0.03),
      types: { grunt: 2, zig: 3, shooter: 3, tank: 2 },
      boss: n % 5 === 0 ? { hp: 60 + k * 8 } : null
    };
  }
  const hpMul = (n) => 1 + (n - 1) * 0.1;

  // ==== Elemen ====
  const board = document.getElementById("board");
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const ov = document.getElementById("ov");
  const ovMain = document.getElementById("ovMain");
  const ovSub = document.getElementById("ovSub");
  const bestEl = document.getElementById("best");
  const maxLvEl = document.getElementById("maxLv");
  const statusEl = document.getElementById("status");
  const histList = document.getElementById("histList");
  const resetBtn = document.getElementById("resetBtn");

  // ==== State ====
  let state = "idle";           // idle | play | over
  let level = null;             // { n, cfg, toSpawn, spawnT, phase, phaseT }
  let score = 0, lives = START_LIVES;
  let px = W / 2, targetX = W / 2;
  let fireT = 0, invT = 0, dblT = 0;
  let enemies = [], pShots = [], eShots = [], powerups = [], fx = [];
  let stars = [];
  let lastT = 0, overAt = 0;
  const held = new Set();

  let best = null, maxLv = null, lastScore = null, hist = [];
  const KEY_BEST = "cyrro_shooter_best";
  const KEY_MAXLV = "cyrro_shooter_maxlv";
  const KEY_HIST = "cyrro_shooter_hist";

  function loadLocal() {
    try {
      best = JSON.parse(localStorage.getItem(KEY_BEST)) ?? null;
      maxLv = JSON.parse(localStorage.getItem(KEY_MAXLV)) ?? null;
      hist = JSON.parse(localStorage.getItem(KEY_HIST)) ?? [];
    } catch { best = null; maxLv = null; hist = []; }
  }
  function saveLocal() {
    try {
      localStorage.setItem(KEY_BEST, JSON.stringify(best));
      localStorage.setItem(KEY_MAXLV, JSON.stringify(maxLv));
      localStorage.setItem(KEY_HIST, JSON.stringify(hist.slice(-10)));
    } catch {}
  }

  function renderStats() {
    bestEl.textContent = best == null ? "—" : best;
    maxLvEl.textContent = maxLv == null ? "—" : "LV " + maxLv;
    histList.innerHTML = hist.length
      ? hist.slice(-5).reverse().map(h => `<li><span>LV ${h.lv}</span><span>${h.s}</span></li>`).join("")
      : `<li><span>Belum ada percobaan</span></li>`;
  }

  function setStatus(msg) { statusEl.textContent = msg || ""; }

  // ==== Util ====
  const clampX = (x, w) => Math.max(w / 2 + 8, Math.min(W - w / 2 - 8, x));
  const rand = (a, b) => a + Math.random() * (b - a);

  function palette() {
    const cs = getComputedStyle(document.documentElement);
    return {
      card: cs.getPropertyValue("--card").trim() || "#FFFFFF",
      fg: cs.getPropertyValue("--fg").trim() || "#0A0A0A"
    };
  }

  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }

  // ==== Efek ====
  function explode(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = rand(60, 240);
      fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, max: 0.5, color, size: rand(2, 5) });
    }
  }
  function spark(x, y) { explode(x, y, COLORS.yellow, 4); }

  function updateFx(dt) {
    for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    fx = fx.filter(p => p.life > 0);
  }

  function updateStars(dt) {
    for (const s of stars) {
      s.y += s.v * dt;
      if (s.y > H) { s.y -= H; s.x = rand(0, W); }
    }
  }

  // ==== Pembuatan objek ====
  function makeEnemy(type, x, n) {
    const b = ETYPES[type];
    const hp = Math.ceil(b.hp * hpMul(n));
    return {
      type, boss: false, dead: false,
      x, baseX: x, y: -b.h, w: b.w, h: b.h,
      hp, maxHp: hp,
      speed: b.speed * (1 + (n - 1) * 0.03),
      t: rand(0, 6), fireT: rand(1, 2.4),
      pts: b.pts
    };
  }

  function makeBoss(hp, n) {
    return {
      type: "boss", boss: true, dead: false,
      x: W / 2, y: 74, w: 120, h: 78,
      hp, maxHp: hp,
      vx: 95, t: 0,
      fireT: 1.2, fireGap: Math.max(0.6, 1.3 - n * 0.03),
      pts: 500
    };
  }

  function pickType(types) {
    const total = Object.values(types).reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (const k in types) {
      r -= types[k];
      if (r <= 0) return k;
    }
    return "grunt";
  }

  function spawnOne() {
    const type = pickType(level.cfg.types);
    const x = clampX(rand(24, W - 24), ETYPES[type].w);
    enemies.push(makeEnemy(type, x, level.n));
  }

  function startLevel(n) {
    level = {
      n,
      cfg: levelCfg(n),
      toSpawn: 0,
      spawnT: 0.6,
      phase: "intro",
      phaseT: 2.2
    };
    level.toSpawn = level.cfg.count;
    eShots = [];
    pShots = [];
    if (maxLv == null || n > maxLv) { maxLv = n; saveLocal(); renderStats(); }
  }

  function start() {
    score = 0;
    lives = START_LIVES;
    px = W / 2; targetX = W / 2;
    fireT = 0; invT = 1.0; dblT = 0;
    enemies = []; pShots = []; eShots = []; powerups = []; fx = [];
    state = "play";
    ov.hidden = true;
    setStatus("");
    startLevel(1);
  }

  function hurt() {
    if (state !== "play" || invT > 0) return;
    lives--;
    invT = 1.6;
    explode(px, PLAYER_Y, COLORS.lime, 22);
    if (lives <= 0) gameOver();
  }

  function killEnemy(e) {
    e.dead = true;
    score += e.pts;
    explode(e.x, e.y, e.boss ? COLORS.pink : COLORS.yellow, e.boss ? 40 : 14);
    if (e.boss) {
      powerups.push({ x: e.x - 20, y: e.y, type: "double", vy: 100 });
      powerups.push({ x: e.x + 20, y: e.y, type: "life", vy: 100 });
    } else if (Math.random() < 0.12) {
      powerups.push({ x: e.x, y: e.y, type: Math.random() < 0.7 ? "double" : "life", vy: 100 });
    }
  }

  function gameOver() {
    state = "over";
    overAt = performance.now();
    const lv = level ? level.n : 1;
    lastScore = score;
    if (best == null || score > best) best = score;
    hist.push({ s: score, lv });
    saveLocal();
    renderStats();
    ovMain.textContent = "GAME OVER";
    ovSub.textContent = `SKOR ${score} · LV ${lv} · TAP UNTUK MAIN LAGI`;
    ov.hidden = false;
    submitScore(score, lv);
  }

  // ==== Update ====
  function update(dt) {
    updateFx(dt);
    updateStars(dt);
    if (state !== "play" || !level) return;

    // gerak pesawat (keyboard atau sentuh/mouse)
    const left = held.has("ArrowLeft") || held.has("a") || held.has("A");
    const right = held.has("ArrowRight") || held.has("d") || held.has("D");
    const kd = left && !right ? -1 : (right && !left ? 1 : 0);
    if (kd) { px += kd * 300 * dt; targetX = px; }
    else px += (targetX - px) * Math.min(1, dt * 14);
    px = Math.max(PH + 6, Math.min(W - PH - 6, px));

    // tembak otomatis
    fireT -= dt;
    if (fireT <= 0) {
      fireT = 0.2;
      if (dblT > 0) {
        pShots.push({ x: px - 9, y: PLAYER_Y - 14 }, { x: px + 9, y: PLAYER_Y - 14 });
      } else {
        pShots.push({ x: px, y: PLAYER_Y - 14 });
      }
    }

    // fase level: intro -> play -> clear
    if (level.phase === "intro") {
      level.phaseT -= dt;
      if (level.phaseT <= 0) {
        level.phase = "play";
        if (level.cfg.boss) enemies.push(makeBoss(level.cfg.boss.hp, level.n));
      }
    } else if (level.phase === "play") {
      if (level.toSpawn > 0) {
        level.spawnT -= dt;
        if (level.spawnT <= 0) {
          spawnOne();
          level.toSpawn--;
          level.spawnT = level.cfg.interval * rand(0.7, 1.3);
        }
      } else if (enemies.length === 0) {
        level.phase = "clear";
        level.phaseT = 2.2;
        score += 100 * level.n;
        lives = Math.min(MAX_LIVES, lives + 1);
        eShots = [];
        pShots = [];
      }
    } else if (level.phase === "clear") {
      level.phaseT -= dt;
      if (level.phaseT <= 0) startLevel(level.n + 1);
    }

    // peluru pemain
    for (const b of pShots) b.y -= 560 * dt;
    pShots = pShots.filter(b => b.y > -20);

    // peluru musuh
    for (const b of eShots) { b.x += b.vx * dt; b.y += b.vy * dt; }
    eShots = eShots.filter(b => b.y < H + 20 && b.x > -20 && b.x < W + 20);

    // gerak musuh
    for (const e of enemies) {
      e.t += dt;
      if (e.type === "boss") {
        e.x += e.vx * dt;
        if (e.x - e.w / 2 < 12) { e.x = 12 + e.w / 2; e.vx = Math.abs(e.vx); }
        if (e.x + e.w / 2 > W - 12) { e.x = W - 12 - e.w / 2; e.vx = -Math.abs(e.vx); }
        e.fireT -= dt;
        if (e.fireT <= 0) {
          e.fireT = e.fireGap;
          for (const a of [-0.35, 0, 0.35]) {
            eShots.push({ x: e.x, y: e.y + e.h / 2, vx: Math.sin(a) * 200, vy: Math.cos(a) * 200 });
          }
        }
      } else if (e.type === "zig") {
        e.y += e.speed * dt;
        e.x = clampX(e.baseX + Math.sin(e.t * 2.6) * 70, e.w);
      } else {
        e.y += e.speed * dt;
        if (e.type === "shooter" || e.type === "tank") {
          e.fireT -= dt;
          if (e.fireT <= 0 && e.y > 20) {
            if (e.type === "shooter") {
              e.fireT = rand(1.5, 2.4);
              const dx = px - e.x, dy = PLAYER_Y - e.y;
              const d = Math.hypot(dx, dy) || 1;
              const sp = 210;
              eShots.push({ x: e.x, y: e.y + e.h / 2, vx: dx / d * sp, vy: dy / d * sp });
            } else {
              e.fireT = 2.4;
              eShots.push({ x: e.x, y: e.y + e.h / 2, vx: 0, vy: 170 });
            }
          }
        }
      }
    }

    // power-up jatuh
    for (const p of powerups) p.y += p.vy * dt;

    // peluru pemain kena musuh
    pShots = pShots.filter(b => {
      for (const e of enemies) {
        if (e.hp > 0 && Math.abs(b.x - e.x) < e.w / 2 + 3 && Math.abs(b.y - e.y) < e.h / 2 + 6) {
          e.hp -= 1;
          spark(b.x, b.y);
          return false;
        }
      }
      return true;
    });
    for (const e of enemies) if (!e.dead && e.hp <= 0) killEnemy(e);

    // peluru musuh kena pemain
    eShots = eShots.filter(b => {
      if (Math.abs(b.x - px) < PH + 4 && Math.abs(b.y - PLAYER_Y) < PH + 4) {
        hurt();
        return false;
      }
      return true;
    });

    // musuh tabrak pemain
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.abs(e.x - px) < e.w / 2 + PH - 2 && Math.abs(e.y - PLAYER_Y) < e.h / 2 + PH - 2) {
        hurt();
        if (!e.boss) { e.dead = true; explode(e.x, e.y, COLORS.yellow, 14); }
      }
    }

    // power-up diambil pemain
    powerups = powerups.filter(p => {
      if (Math.abs(p.x - px) < 18 && Math.abs(p.y - PLAYER_Y) < 18) {
        if (p.type === "double") dblT = 8;
        else lives = Math.min(MAX_LIVES, lives + 1);
        spark(p.x, p.y);
        return false;
      }
      return p.y < H + 30;
    });

    enemies = enemies.filter(e => !e.dead && e.y < H + 60);
    eShots = eShots.filter(b => b.y < H + 20);

    if (state !== "play") return;
    invT -= dt;
    dblT -= dt;
  }

  // ==== Gambar ====
  function drawBox(x, y, w, h, fill, stroke, lw = 2.5) {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.strokeRect(x + lw / 2, y + lw / 2, w - lw, h - lw);
  }

  function drawShip(x, y, fg) {
    // badan pesawat
    ctx.beginPath();
    ctx.moveTo(x, y - 16);
    ctx.lineTo(x + 14, y + 12);
    ctx.lineTo(x, y + 6);
    ctx.lineTo(x - 14, y + 12);
    ctx.closePath();
    ctx.fillStyle = COLORS.lime;
    ctx.fill();
    ctx.strokeStyle = fg;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // kokpit
    ctx.fillStyle = fg;
    ctx.fillRect(x - 3, y - 5, 6, 9);
    // api mesin
    ctx.fillStyle = COLORS.pink;
    ctx.beginPath();
    ctx.moveTo(x - 5, y + 12);
    ctx.lineTo(x + 5, y + 12);
    ctx.lineTo(x, y + 12 + 6 + Math.random() * 4);
    ctx.closePath();
    ctx.fill();
  }

  function drawEnemy(e, fg) {
    const { x, y, w, h } = e;
    if (e.type === "grunt") {
      drawBox(x - w / 2, y - h / 2, w, h, COLORS.pink, fg);
      ctx.fillStyle = fg;
      ctx.fillRect(x - 7, y - 3, 4, 4);
      ctx.fillRect(x + 3, y - 3, 4, 4);
    } else if (e.type === "zig") {
      ctx.beginPath();
      ctx.moveTo(x, y - h / 2);
      ctx.lineTo(x + w / 2, y);
      ctx.lineTo(x, y + h / 2);
      ctx.lineTo(x - w / 2, y);
      ctx.closePath();
      ctx.fillStyle = COLORS.cyan;
      ctx.fill();
      ctx.strokeStyle = fg; ctx.lineWidth = 2.5; ctx.stroke();
    } else if (e.type === "shooter") {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 3 * i;
        const px_ = x + Math.cos(a) * w / 2;
        const py_ = y + Math.sin(a) * h / 2;
        i === 0 ? ctx.moveTo(px_, py_) : ctx.lineTo(px_, py_);
      }
      ctx.closePath();
      ctx.fillStyle = COLORS.yellow;
      ctx.fill();
      ctx.strokeStyle = fg; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === "tank") {
      drawBox(x - w / 2, y - h / 2, w, h, COLORS.white, fg);
      ctx.fillStyle = COLORS.gray;
      ctx.fillRect(x - 3, y + 6, 6, h / 2 + 4);
      ctx.strokeStyle = fg; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = COLORS.gray; ctx.fill(); ctx.stroke();
    }
    // bar HP untuk musuh bertahan lama
    if (e.maxHp > 1 && e.type !== "boss") {
      const bw = w - 4;
      ctx.fillStyle = fg;
      ctx.fillRect(x - bw / 2, y - h / 2 - 7, bw * (e.hp / e.maxHp), 3);
    }
  }

  function drawBoss(e, fg) {
    const { x, y, w, h } = e;
    // duri
    ctx.fillStyle = COLORS.pink;
    ctx.strokeStyle = fg; ctx.lineWidth = 2.5;
    for (let i = 0; i < 5; i++) {
      const sx = x - w / 2 + 12 + i * (w - 24) / 4;
      ctx.beginPath();
      ctx.moveTo(sx - 9, y - h / 2 + 2);
      ctx.lineTo(sx, y - h / 2 - 14);
      ctx.lineTo(sx + 9, y - h / 2 + 2);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    drawBox(x - w / 2, y - h / 2, w, h, COLORS.pink, fg);
    // mata
    ctx.fillStyle = COLORS.white;
    ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = fg; ctx.lineWidth = 2.5; ctx.stroke();
    const look = Math.max(-1, Math.min(1, (px - x) / 120));
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(x + look * 5, y + 1, 6, 0, Math.PI * 2); ctx.fill();
  }

  function drawHud(fg) {
    ctx.fillStyle = fg;
    ctx.textBaseline = "alphabetic";
    // skor
    ctx.textAlign = "left";
    ctx.font = "30px Anton, Impact, sans-serif";
    ctx.fillText(String(score), 14, 34);
    // level
    const lv = level ? level : { n: 1, cfg: LEVELS[0] };
    ctx.textAlign = "center";
    ctx.font = "700 11px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillText(`LV ${lv.n} · ${lv.cfg.name}`, W / 2, 22);
    // nyawa
    for (let i = 0; i < lives; i++) {
      const hx = W - 22 - i * 20, hy = 26;
      ctx.beginPath();
      ctx.moveTo(hx, hy - 8); ctx.lineTo(hx + 7, hy + 5); ctx.lineTo(hx - 7, hy + 5);
      ctx.closePath();
      ctx.fillStyle = COLORS.lime; ctx.fill();
      ctx.strokeStyle = fg; ctx.lineWidth = 1.5; ctx.stroke();
    }
    // timer power-up ganda
    if (dblT > 0) {
      ctx.fillStyle = COLORS.cyan;
      ctx.fillRect(14, 42, 60 * (dblT / 8), 4);
      ctx.strokeStyle = fg; ctx.lineWidth = 1.5;
      ctx.strokeRect(14, 42, 60, 4);
    }
    // HP boss
    const boss = enemies.find(e => e.boss && !e.dead);
    if (boss) {
      const bw = 200;
      ctx.fillStyle = fg;
      ctx.fillRect(W / 2 - bw / 2 - 2, 60, bw + 4, 12);
      ctx.fillStyle = COLORS.pink;
      ctx.fillRect(W / 2 - bw / 2, 62, bw * Math.max(0, boss.hp / boss.maxHp), 8);
    }
  }

  function drawBanner(fg) {
    if (state !== "play" || !level) return;
    if (level.phase === "intro") {
      const bw = 260, bh = 90, bx = W / 2 - bw / 2, by = H / 2 - bh / 2 - 30;
      drawBox(bx, by, bw, bh, palette().card, fg, 3);
      ctx.textAlign = "center";
      ctx.fillStyle = fg;
      ctx.font = "40px Anton, Impact, sans-serif";
      ctx.fillText(`LEVEL ${level.n}`, W / 2, by + 44);
      ctx.font = "700 12px 'JetBrains Mono', ui-monospace, monospace";
      ctx.fillText(level.cfg.name + (level.cfg.boss ? " · BOSS" : ""), W / 2, by + 68);
    } else if (level.phase === "clear") {
      const bw = 260, bh = 90, bx = W / 2 - bw / 2, by = H / 2 - bh / 2 - 30;
      drawBox(bx, by, bw, bh, COLORS.lime, fg, 3);
      ctx.textAlign = "center";
      ctx.fillStyle = fg;
      ctx.font = "38px Anton, Impact, sans-serif";
      ctx.fillText("LEVEL CLEAR", W / 2, by + 46);
      ctx.font = "700 12px 'JetBrains Mono', ui-monospace, monospace";
      ctx.fillText(`BONUS +${100 * level.n} · +1 NYAWA`, W / 2, by + 70);
    }
  }

  function draw() {
    const { card, fg } = palette();
    ctx.fillStyle = card;
    ctx.fillRect(0, 0, W, H);

    // grid tipis
    ctx.strokeStyle = fg;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.06;
    for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.globalAlpha = 1;

    // bintang berjalan, warna mengikuti level
    const acc = ACCENTS[((level ? level.n : 1) - 1) % ACCENTS.length];
    ctx.fillStyle = acc;
    ctx.globalAlpha = 0.55;
    for (const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s);
    ctx.globalAlpha = 1;

    // garis dasar
    ctx.fillStyle = fg;
    ctx.fillRect(0, H - 6, W, 6);

    // power-up
    for (const p of powerups) {
      const isDbl = p.type === "double";
      drawBox(p.x - 13, p.y - 13, 26, 26, isDbl ? COLORS.cyan : COLORS.pink, fg, 2);
      ctx.fillStyle = "#0A0A0A";
      ctx.textAlign = "center";
      ctx.font = "700 12px 'JetBrains Mono', ui-monospace, monospace";
      ctx.fillText(isDbl ? "2X" : "+1", p.x, p.y + 4);
    }

    // musuh
    for (const e of enemies) {
      if (e.boss) drawBoss(e, fg);
      else drawEnemy(e, fg);
    }

    // peluru musuh
    for (const b of eShots) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.pink;
      ctx.fill();
      ctx.strokeStyle = fg; ctx.lineWidth = 1.5; ctx.stroke();
    }

    // peluru pemain
    for (const b of pShots) {
      drawBox(b.x - 2, b.y - 7, 4, 14, COLORS.lime, fg, 1.5);
    }

    // pemain
    const blink = invT > 0 && Math.floor(invT * 10) % 2 === 0;
    if (state === "play" && !blink) drawShip(px, PLAYER_Y, fg);

    // efek partikel
    for (const p of fx) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    if (state !== "idle") drawHud(fg);
    drawBanner(fg);
  }

  function frame(t) {
    const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ==== Input ====
  function toGameX(clientX) {
    const r = board.getBoundingClientRect();
    return (clientX - r.left) / r.width * W;
  }

  board.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    board.setPointerCapture?.(e.pointerId);
    targetX = toGameX(e.clientX);
    if (state === "idle" || (state === "over" && performance.now() - overAt > 500)) start();
  });
  board.addEventListener("pointermove", (e) => {
    targetX = toGameX(e.clientX);
  });

  document.addEventListener("keydown", (e) => {
    if (e.target === resetBtn) return;
    const k = e.key;
    if (["ArrowLeft", "ArrowRight", " ", "Enter", "a", "d", "A", "D"].includes(k)) e.preventDefault();
    held.add(k);
    if (k === " " || k === "Enter") {
      if (state === "idle" || (state === "over" && performance.now() - overAt > 500)) start();
    }
  });
  document.addEventListener("keyup", (e) => held.delete(e.key));
  window.addEventListener("blur", () => held.clear());

  resetBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    best = null;
    maxLv = null;
    lastScore = null;
    hist = [];
    saveLocal();
    renderStats();
    setStatus("");
  });

  // ==== Kirim skor ke Supabase ====
  // Ambil token login dari localStorage (pola sama seperti game lain).
  function getToken() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith("sb-") && k.endsWith("-auth-token")) {
          const v = JSON.parse(localStorage.getItem(k));
          if (v && v.access_token) return { token: v.access_token, uid: v.user?.id };
        }
      }
    } catch {}
    return null;
  }

  async function submitScore(s, lv) {
    if (s <= 0) { setStatus("Skor 0 tidak disimpan"); return; }

    const auth = getToken();
    if (!auth || !auth.uid) { setStatus("LOGIN DULU untuk simpan skor"); return; }

    try {
      const res = await fetch(`${SB_URL}/rest/v1/${TABLE}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SB_KEY,
          "Authorization": "Bearer " + auth.token,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ user_id: auth.uid, score: s, level: lv })
      });
      setStatus(res.ok ? "TERSIMPAN" : "GAGAL KIRIM (" + res.status + ")");
    } catch {
      setStatus("GAGAL KIRIM");
    }
  }

  // ==== Init ====
  loadLocal();
  renderStats();
  resize();
  window.addEventListener("resize", resize);
  stars = Array.from({ length: 40 }, () => ({ x: rand(0, W), y: rand(0, H), s: rand(1, 2.5), v: rand(20, 70) }));
  requestAnimationFrame(frame);
})();
</script>
<script src="../../diagnostics.js"></script>
</body>
