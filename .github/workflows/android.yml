name: Android APK

on:
  push:
    branches:
      - main
      - "setup/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare local web assets
        shell: bash
        run: |
          mkdir -p www
          rsync -a --delete \
            --exclude='/www/' \
            --exclude='/android/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/package*.json' \
            --exclude='/capacitor.config.json' \
            ./ www/

          test -f www/index.html
          test -f www/manifest.json
          test -f www/sw.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets with Android
        run: npx cap sync android

      - name: Build Debug and Release APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: c-library-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: c-library-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
